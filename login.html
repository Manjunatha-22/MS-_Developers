<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User & Admin Login | Satva Developers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <div class="text-center mb-4">
          <a class="navbar-brand text-primary fs-2 fw-bold" href="index.html">
            <i class="fas fa-building text-secondary"></i> SATVA <span class="gold-accent">DEVELOPERS</span>
          </a>
          <p class="text-muted">Sign in to your buyer portal or admin account</p>
        </div>

        <div class="ms-card p-4 p-md-5">
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control form-control-custom" id="loginEmail" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label">Password</label>
                <a href="#" class="small text-secondary" onclick="showToast('Password reset link sent to registered email.', 'info')">Forgot Password?</a>
              </div>
              <input type="password" class="form-control form-control-custom" id="loginPassword" placeholder="••••••••" required>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe">
              <label class="form-check-label small" for="rememberMe">Remember me on this device</label>
            </div>

            <button type="submit" class="btn btn-emerald btn-lg w-100 mb-3">Sign In</button>
          </form>

          <div class="alert alert-info py-2 small mb-3">
            <i class="fas fa-info-circle me-1"></i> Admin Demo: <b>admin@satvadevelopers.in</b> / <b>admin123</b>
          </div>

          <div class="text-center">
            <span class="text-muted small">Don't have an account? </span>
            <a href="register.html" class="fw-bold text-secondary">Register Now</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
