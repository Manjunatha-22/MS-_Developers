<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration | Satva Developers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-md-7 col-lg-6">
        
        <div class="text-center mb-4">
          <a class="navbar-brand text-primary fs-2 fw-bold" href="index.html">
            <i class="fas fa-building text-secondary"></i> SATVA <span class="gold-accent">DEVELOPERS</span>
          </a>
          <p class="text-muted">Create a buyer account to save wishlist properties & book site visits</p>
        </div>

        <div class="ms-card p-4 p-md-5">
          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control form-control-custom" id="regName" placeholder="Rajesh Kumar" required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control form-control-custom" id="regEmail" placeholder="rajesh@example.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control form-control-custom" id="regPhone" placeholder="8197287448" required>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" class="form-control form-control-custom" id="regPassword" placeholder="••••••••" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control form-control-custom" id="regConfirmPassword" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-emerald btn-lg w-100 mb-3">Verify OTP & Register</button>
          </form>

          <div class="text-center">
            <span class="text-muted small">Already have an account? </span>
            <a href="login.html" class="fw-bold text-secondary">Sign In</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- OTP Modal -->
  <div class="modal fade" id="otpModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white" style="background: var(--primary) !important;">
          <h5 class="modal-title text-white"><i class="fas fa-mobile-alt text-secondary me-2"></i>Mobile OTP Verification</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 text-center">
          <p class="text-muted mb-3">Enter the 4-digit verification code sent to your mobile number. (Demo Code: <b>1234</b>)</p>
          <form id="otpForm">
            <input type="text" class="form-control form-control-lg text-center letter-spacing-2 mb-3" id="otpInput" maxlength="4" placeholder="1 2 3 4" required style="letter-spacing: 10px; font-size: 1.8rem;">
            <button type="submit" class="btn btn-gold w-100 py-2">Verify Code & Finish</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
